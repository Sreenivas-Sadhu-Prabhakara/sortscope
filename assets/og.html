<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: none; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  :root {
    --bg: #0e1416;
    --bg-2: #121b1e;
    --panel: #16211f;
    --line: #24332f;
    --ink: #dfe9e4;
    --ink-dim: #9db0a8;
    --ink-faint: #6d8079;
    --phosphor: #4fe3a1;
    --amber: #f2b45c;
    --cyan: #56c6e8;
    --coral: #ff7a6b;
    --violet: #b79bff;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    position: relative;
    overflow: hidden;
    background-image:
      linear-gradient(rgba(120, 200, 175, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 200, 175, 0.05) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  /* vignette so the grid recedes at the edges */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 30% 20%, transparent 40%, rgba(6,10,11,0.75) 100%);
  }
  /* baseline ticks on the trace panel */
  .frame {
    position: absolute;
    left: 64px; top: 64px; right: 64px; bottom: 64px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(18,27,30,0.65), rgba(10,17,17,0.8));
    box-shadow: inset 0 0 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.02);
    overflow: hidden;
  }
  .scanline {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,0.14) 3px 4px);
    opacity: 0.5;
  }
  /* the trace SVG spans the whole frame as ambient signal */
  .trace-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .content {
    position: absolute;
    left: 108px; top: 96px; right: 108px;
    display: flex; flex-direction: column; gap: 24px;
    max-width: 720px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 19px; letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--ink-faint);
    display: flex; align-items: center; gap: 16px;
  }
  .eyebrow .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--phosphor); box-shadow: 0 0 12px var(--phosphor); }
  .wordmark {
    font-size: 112px; font-weight: 800; letter-spacing: -0.035em; line-height: 0.92;
  }
  .wordmark .sort { color: var(--ink); }
  .wordmark .scope { color: var(--phosphor); text-shadow: 0 0 26px rgba(79,227,161,0.35); }
  .lede {
    font-size: 31px; line-height: 1.34; color: var(--ink-dim); max-width: 27ch; font-weight: 450;
  }
  .lede b { color: var(--ink); font-weight: 650; }
  /* chip row of the step vocabulary — the shared model made visible */
  .chips { display: flex; gap: 12px; margin-top: 4px; }
  .chip {
    font-family: var(--mono); font-size: 17px; letter-spacing: 0.02em;
    padding: 8px 14px; border-radius: 7px;
    border: 1px solid var(--line);
    display: flex; align-items: center; gap: 9px;
    color: var(--ink-dim);
    background: rgba(10,17,17,0.5);
  }
  .chip i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .c-compare i { background: var(--amber); }
  .c-swap i { background: var(--coral); }
  .c-visit i { background: #3f7fb8; }
  .c-path i { background: var(--violet); }
  .c-sorted i { background: var(--phosphor); }

  .meta {
    position: absolute; left: 108px; bottom: 86px; right: 108px;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-family: var(--mono); font-size: 19px; color: var(--ink-faint);
  }
  .meta .count { color: var(--cyan); }
  .meta .count b { color: var(--ink); font-weight: 700; }
  .meta .privacy { letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="frame">
    <div class="scanline"></div>
    <svg class="trace-svg" viewBox="0 0 1072 502" preserveAspectRatio="none">
      <!-- baseline -->
      <line x1="0" y1="330" x2="1072" y2="330" stroke="rgba(120,200,175,0.10)" stroke-width="1"/>
      <!-- ambient sort-trace: a bar array being scanned, drawn as an oscilloscope signal -->
      <polyline
        points="0,330 40,330 40,300 80,300 80,258 120,258 120,290 160,290 160,210 200,210 200,246 240,246 240,168 280,168 280,300 320,300 320,132 360,132 360,222 400,222 400,96 440,96 440,270 480,270 480,150 520,150 520,330"
        fill="none" stroke="rgba(86,198,232,0.22)" stroke-width="2" stroke-linejoin="round"/>
      <!-- the live phosphor trace sweeping right -->
      <polyline
        points="520,330 560,330 566,214 600,214 606,300 640,300 646,120 690,120 696,258 730,258 736,186 780,186 786,300 826,300 832,150 876,150 882,240 920,240 926,88 972,88 978,300 1016,300 1022,204 1072,204"
        fill="none" stroke="#4fe3a1" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"
        filter="url(#glow)"/>
      <circle cx="1072" cy="204" r="7" fill="#4fe3a1" filter="url(#glow)"/>
      <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
    </svg>
  </div>
  <div class="vignette"></div>

  <div class="content">
    <div class="eyebrow"><span class="dot"></span>Interactive algorithm visualizer</div>
    <div class="wordmark"><span class="sort">Sort</span><span class="scope">Scope</span></div>
    <div class="lede">Watch <b>sorting, pathfinding, graphs &amp; search</b> run step by step — synced pseudocode, honest counters.</div>
    <div class="chips">
      <span class="chip c-compare"><i></i>compare</span>
      <span class="chip c-swap"><i></i>swap</span>
      <span class="chip c-visit"><i></i>visit</span>
      <span class="chip c-path"><i></i>path</span>
      <span class="chip c-sorted"><i></i>settled</span>
    </div>
  </div>

  <div class="meta">
    <span class="count"><b>21</b> algorithms · one playback engine</span>
    <span class="privacy">100% client-side · nothing leaves the device</span>
  </div>
</body>
</html>
